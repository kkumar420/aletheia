{% extends "books/base.html" %}
{% load static %}

{% block title %}
Login | Aletheia
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            <h1>Aletheia</h1>
            <p>Organize what shapes your understanding</p>
        </div>

        <form id="login-form">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="input"
                    placeholder="Enter username"
                    required>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="input"
                    placeholder="Enter password"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%; margin-top:0.5rem;">

                Sign In

            </button>

            <div
                id="error-message"
                class="error-message">
            </div>

        </form>

        <div class="auth-footer">

            <p>
                Don't have an account?

                <a href="/api/register-page/"
                   class="auth-link">

                    Create one

                </a>
            </p>

        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'books/js/login.js' %}"></script>
{% endblock %}
