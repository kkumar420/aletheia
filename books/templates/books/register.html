{% extends "books/base.html" %}
{% load static %}

{% block title %}
Create Account | Aletheia
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card card">

        <div class="auth-logo">
            <h1>Aletheia</h1>
            <p>Begin building your personal library</p>
        </div>

        <form id="register-form">

            <div class="form-group">
                <label for="reg-username">
                    Username
                </label>

                <input
                    type="text"
                    id="reg-username"
                    class="input"
                    placeholder="Choose a username"
                    required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="reg-email">
                    Email <span class="text-secondary text-sm">(optional)</span>
                </label>

                <input
                    type="email"
                    id="reg-email"
                    class="input"
                    placeholder="you@example.com"
                    autocomplete="email">
            </div>

            <div class="form-group">
                <label for="reg-password">
                    Password
                </label>

                <input
                    type="password"
                    id="reg-password"
                    class="input"
                    placeholder="Create a password"
                    required
                    autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="reg-confirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="reg-confirm"
                    class="input"
                    placeholder="Repeat your password"
                    required
                    autocomplete="new-password">
            </div>

            <button
                type="submit"
                id="register-btn"
                class="btn btn-primary"
                style="width:100%; margin-top:0.5rem;">

                Create Account

            </button>

            <div
                id="error-message"
                class="error-message">
            </div>

        </form>

        <div class="auth-footer">

            <p>
                Already have an account?

                <a href="/api/login-page/"
                   class="auth-link">

                    Log in

                </a>
            </p>

        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'books/js/register.js' %}"></script>
{% endblock %}
