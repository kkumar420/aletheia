{% extends "books/base.html" %}
{% load static %}

{% block title %}
Add Book | Aletheia
{% endblock %}

{% block content %}
<div class="page-container">
    
    <div class="page-header mb-lg">
        <a href="/api/" class="back-link">← Back to Library</a>
    </div>

    <div class="card p-xl mb-lg text-center add-book-card">
        <h1 class="mb-sm">Discover Books</h1>
        <p class="text-secondary mb-lg">Search the Open Library database to add to your collection.</p>
        
        <form id="search-form" class="flex gap-sm add-book-search">
            <input type="text" id="search-input" class="input" placeholder="Search by title, author, or ISBN..." required autocomplete="off">
            <button type="button" id="advanced-toggle" class="advanced-toggle" title="Advanced Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                    <circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="14" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/>
                </svg>
            </button>
            <button type="submit" id="search-btn" class="btn btn-primary add-book-search__submit">Search</button>
        </form>

        <div id="advanced-panel" class="advanced-panel">
            <div class="advanced-panel__grid">
                <div class="form-group">
                    <label for="adv-title">Title</label>
                    <input type="text" id="adv-title" class="input" placeholder="Book title..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="adv-author">Author</label>
                    <input type="text" id="adv-author" class="input" placeholder="Author name..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="adv-isbn">ISBN</label>
                    <input type="text" id="adv-isbn" class="input" placeholder="e.g. 9780141187761" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="adv-language">Language</label>
                    <select id="adv-language" class="input">
                        <option value="">Any Language</option>
                        <option value="eng">English</option>
                        <option value="spa">Spanish</option>
                        <option value="fre">French</option>
                        <option value="ger">German</option>
                        <option value="ita">Italian</option>
                        <option value="por">Portuguese</option>
                        <option value="jpn">Japanese</option>
                        <option value="chi">Chinese</option>
                        <option value="ara">Arabic</option>
                        <option value="hin">Hindi</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-spinner" class="text-center text-secondary mb-lg" style="display: none;">
        <p>Searching the archives...</p>
    </div>

    <div id="results-container" class="books-grid">
    </div>

    <div id="load-more-container" class="text-center" style="display: none; margin-top: 3rem;">
        <button type="button" id="load-more-btn" class="btn btn-view" style="min-width: 200px;">
            Load More Results
        </button>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'books/js/add_book.js' %}"></script>
{% endblock %}
