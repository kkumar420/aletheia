{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Aletheia
        {% endblock %}
    </title>

    <link rel="icon" type="image/x-icon" href="{% static 'books/images/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'books/images/favicon-32x32.png' %}">

    <link rel="stylesheet"
          href="{% static 'books/css/style.css' %}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>
    <script>
        // BFCache Guard — redirect logged-out users immediately on back/forward navigation
        window.addEventListener("pageshow", function(e) {
            // Fires on normal load AND on BFCache restore (e.persisted === true)
            // Only guard pages that aren't the login/register pages themselves
            if (window.location.pathname !== "/login-page/" && window.location.pathname !== "/register-page/") {
                if (!localStorage.getItem("access")) {
                    window.location.replace("/login-page/");
                }
            }
        });

        // Check theme globally before the page renders
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light-theme"); 
        }
    </script>

    <div class="app-container">

        {% block content %}
        {% endblock %}

    </div>

    {% block scripts %}
    {% endblock %}

</body>

</html>
