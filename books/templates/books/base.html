{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Aletheia
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'books/css/style.css' %}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>
    <script>
        // Check theme globally before the page renders
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light-theme"); 
            // Note: Change body.light-theme to :root.light-theme in CSS if using documentElement
        }
    </script>

    <div class="app-container">

        {% block content %}
        {% endblock %}

    </div>

    {% block scripts %}
    {% endblock %}

</body>

</html>
